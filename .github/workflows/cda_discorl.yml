name: cda_discorl

# Tests cda_discorl (the DiscoRL extension for gym-continuousDoubleAuction)
# against an installed gym-CDA.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      gym_cda_ref:
        description: gym-continuousDoubleAuction branch, tag or commit to test against
        required: false

# The job only reads the repository; a default token would carry more scope.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The pinned tag is the gate: it is what a release is tested against.
        # master runs alongside it, so a break there shows up here rather than
        # in a user's run; it is not required to pass (#20).
        gym_cda_ref: ["v2.3.0", "master"]
    continue-on-error: ${{ matrix.gym_cda_ref == 'master' }}
    env:
      # The gym-CDA ref carrying the extension point this package needs. A
      # `workflow_dispatch` run can name another one.
      GYM_CDA_REF: ${{ inputs.gym_cda_ref || matrix.gym_cda_ref }}

    steps:
      - uses: actions/checkout@v4
        with:
          # DeepMind's disco_rl (the ChuaCheowHuan/disco_rl fork), pinned and
          # shipped unchanged as the top-level package `disco_rl`.
          submodules: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Lint and format
        # docs/development.md §2: the style is `ruff format` and `pyflakes`, and
        # nothing else checks it (#21). Pinned with the Python version's tools,
        # so a formatter release does not fail an unchanged tree.
        run: |
          pip install ruff==0.17.4 pyflakes
          ruff format --check .
          pyflakes cda_discorl tests

      - name: Install gym-CDA (CPU torch) and cda_discorl
        run: |
          python -m pip install --upgrade pip
          pip install torch==2.13.0 --extra-index-url https://download.pytorch.org/whl/cpu
          pip install "gym_continuousDoubleAuction @ git+https://github.com/ChuaCheowHuan/gym-continuousDoubleAuction@${GYM_CDA_REF}"
          pip install ".[test]"

      - name: Tests, including one real training iteration
        run: python -m pytest -q
